<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Student Form</title>
</head>
<body>

    <div style="border: 1px solid black;"><h2 style="text-align: center;">Student Registration Form</h2></div>

    <div style="border: 1px solid black; padding: 20px; text-align: center;">
        <form action="#" method="post">

        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone"><br><br>

        <label for="enrollment">Enrollment Number:</label><br>
        <input type="text" id="enrollment"><br><br>

        <label for="department">Department:</label><br>
        <select id="department">
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Electronics & Communication</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
        </select><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male">
        <label for="male">Male</label>

        <input type="radio" id="female" >
        <label for="female">Female</label>

        <input type="radio" id="other">
        <label for="other">Other</label><br><br>

        <label>Skills:</label><br>
        <input type="checkbox" id="java">
        <label for="java">Java</label>

        <input type="checkbox" id="python">
        <label for="python">Python</label>

        <input type="checkbox" id="web" >
        <label for="web">Web Development</label><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="30"></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
    </div>

</body>
</html>
